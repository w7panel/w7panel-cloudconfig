name: Push zpk

on:
  push:
    tags:
      - "v1.0.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-zpk:
    name: Push zpk
    runs-on: ubuntu-latest

    env:
      ZPK_IDC_DOCKER_USERNAME: ${{ secrets.ZPK_IDC_DOCKER_USERNAME }}
      ZPK_IDC_DOCKER_PASSWORD: ${{ secrets.ZPK_IDC_DOCKER_PASSWORD }}
      ZPK_IDC_HOST: ${{ vars.ZPK_IDC_HOST }}
      ZPK_IDC_ARTIFACT: ${{ vars.ZPK_IDC_ARTIFACT }}
      GO_VERSION: "1.25"
      NODE_VERSION: "20"
      KO_DOCKER_REPO: ghcr.io/w7panel/w7panel-cloudconfig
      KO_DEFAULTBASEIMAGE: ccr.ccs.tencentyun.com/afan-public/ubuntu:24.04-offlineui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          set -euo pipefail
          mkdir -p dist
          # helm package ./charts/w7panel-cloudconfig --app-version="${GITHUB_REF_NAME}" --version "${GITHUB_REF_NAME}" --destination dist
          helm package ./charts/w7panel-cloudconfig --destination dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup ko
        uses: ko-build/setup-ko@v0.8

      - name: Build frontend
        working-directory: ui
        run: |
          npm install
          npm run build
          cd dist && rm -rf ./dist.zip && zip -r dist.zip ./*
      - name: Build and push image
        # working-directory: w7panel-server
        env:
          KO_DOCKER_REPO: ${{ env.KO_DOCKER_REPO }}
          KO_DEFAULTBASEIMAGE: ${{ env.KO_DEFAULTBASEIMAGE }}
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
           # ko login ccr.ccs.tencentyun.com -u "${TENCENT_DOCKER_USERNAME}" -p "${TENCENT_DOCKER_PASSWORD}"
        run: |
          ko login ghcr.io -u "${DOCKER_USERNAME}" -p "${DOCKER_PASSWORD}"
          ko build --bare --tags="${GITHUB_REF_NAME}" --tag-only --sbom=none --platform=linux/amd64 .

      - name: Push zpk
        run: |
          sudo curl -L --fail -o /usr/local/bin/zpk https://github.com/w7panel/w7panel-zpk/releases/download/latest/zpk_linux_amd64
          sudo chmod +x /usr/local/bin/zpk

          set -euo pipefail

          if [ -z "${ZPK_IDC_DOCKER_USERNAME:-}" ]; then
            echo "ZPK_IDC_DOCKER_USERNAME secret is required"
            exit 1
          fi
          if [ -z "${ZPK_IDC_DOCKER_PASSWORD:-}" ]; then
            echo "ZPK_IDC_DOCKER_PASSWORD secret is required"
            exit 1
          fi
          if [ -z "${ZPK_IDC_HOST:-}" ]; then
            echo "ZPK_IDC_HOST variable is required"
            exit 1
          fi
          if [ -z "${ZPK_IDC_ARTIFACT:-}" ]; then
            echo "ZPK_IDC_ARTIFACT variable is required"
            exit 1
          fi

          mapfile -t helm_packages < <(find dist -maxdepth 1 -type f -name '*.tgz' | sort)
          if [ "${#helm_packages[@]}" -eq 0 ]; then
            echo "helm package not found under dist/"
            exit 1
          fi
          if [ "${#helm_packages[@]}" -gt 1 ]; then
            echo "multiple helm packages found under dist/:"
            printf '  %s\n' "${helm_packages[@]}"
            exit 1
          fi
          HELM_PACKAGE="${helm_packages[0]}"

          zpk login --username="${ZPK_IDC_DOCKER_USERNAME}" --password="${ZPK_IDC_DOCKER_PASSWORD}" --host="${ZPK_IDC_HOST}"
          zpk use "${ZPK_IDC_ARTIFACT}"
          zpk attach add --path="${HELM_PACKAGE}" --type=helm
          zpk attach add --path="./ui/dist/dist.zip" --type=frontend
          zpk push
